<html lang="en">
<head>
<meta charset="utf-8">
<title>Skill Fix Loop · walkthrough</title>
<style>

     --data   cyan    a run / trace moving through the code
     --fail   coral   failures and errors

     --human  violet  the human review step
     --ok     green   success and fixes
     dashed gray      optional LLM steps */
  :root {

  #viewport { width: 1920px; height: 1080px; transform-origin: 0 0; }
  #stage { width: 1920px; height: 1080px; position: relative; overflow: hidden;
           background: radial-gradient(ellipse at 30% 0%, #141b27 0%, var(--bg) 60%); }
  .scene { position: absolute; inset: 0; display: none; }
  .abs { position: absolute; }
  #chapter { position: absolute; left: 80px; top: 44px; font: 600 21px var(--body); color: var(--muted);

  #chapter b { color: var(--data); font-family: var(--mono); font-weight: 700; margin-right: 2px; }
  #progress { position: absolute; left: 80px; right: 80px; top: 1046px; height: 4px; display: flex; gap: 8px; z-index: 5; }

  #progress .fill { position: absolute; inset: 0; background: var(--data); transform-origin: 0 0; }

  .muted { color: var(--muted); }

  .tag { display: inline-block; font: 16px var(--mono); color: var(--muted); border: 1px solid var(--line);

  .idchip { display: inline-block; font: 18px var(--mono); color: var(--data); border: 1.5px solid #2e5566; border-radius: 8px;
            padding: 4px 12px; margin: 0 10px 10px 0; }
  .btn { display: inline-block; font: 600 26px var(--body); padding: 14px 34px; border-radius: 12px; margin-right: 18px; }
  .bar-track { height: 26px; background: #232c3c; border-radius: 4px; position: relative; overflow: hidden; }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ok); border-radius: 0 4px 4px 0; }
  .shot { position: absolute; width: 326px; height: 300px; border-radius: 12px; overflow: hidden; border: 1.5px solid var(--line);
          background: #f6f7f9; }
  .shot img { width: 560px; height: auto; display: block; }
  .shotcap { position: absolute; width: 326px; text-align: center; font: 600 21px var(--body); color: var(--soft); }

  .gcard { position: absolute; left: 0; top: 0; width: 100%; height: 100%; padding: 36px 40px; }
  .gtitle { font: 600 34px var(--display); margin-bottom: 26px; }
  .recap { display: flex; align-items: center; gap: 22px; font: 600 34px var(--body); margin-bottom: 26px; }

  .next { display: inline-block; font: 600 24px var(--body); border: 1.5px solid var(--line); border-radius: 999px;

  /* preview controls (not part of the rendered frame) */
  #controls { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; display: flex; gap: 14px; align-items: center;

  #controls input[type=range] { flex: 1; }
  #controls button { font: 600 14px var(--body); padding: 6px 14px; }
  body.render #controls { display: none; }
</style>

<script>
"use strict";
const T = window.TIMING;
const params = new URLSearchParams(location.search);
if (params.has("render")) document.body.classList.add("render");

// ------------------------------------------------------------------ helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const prog = (lt, t0, d = 0.6) => ease(clamp((lt - t0) / d));
const mix = (a, b, p) => a + (b - a) * p;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function show(el, p, dy = 18) {
  el.style.opacity = p;
  el.style.transform = `translateY(${((1 - p) * dy).toFixed(2)}px)`;
  el.style.visibility = p <= 0.001 ? "hidden" : "visible";
}
// Fade in at t0, fade out at t1 (t1 optional).
const window_ = (lt, t0, t1 = Infinity, d = 0.5) => prog(lt, t0, d) * (1 - prog(lt, t1, d));

// Word-level beat lookup: the local time (s) at which `phrase` starts being spoken in scene n.
const NORM = w => w.toLowerCase().replace(/[^a-z0-9]/g, "");
function beatFinder(sc) {
  const words = sc.sentences.flatMap(s => s.words).filter(w => NORM(w.w));
  let text = "", owner = [];
  words.forEach((w, i) => { const n = NORM(w.w); text += n; for (const _ of n) owner.push(i); });
  return (phrase, after = 0) => {
    const target = NORM(phrase);
    let from = 0;
    while (from < owner.length && words[owner[from]].start < after) from++;
    const at = text.indexOf(target, from);
    if (at < 0) throw new Error(`Scene ${sc.n}: phrase not found: "${phrase}"`);
    return words[owner[at]].start;
  };
}

function highlightPython(line) {
  const re = /(#.*$)|(r?f?"(?:[^"\\]|\\.)*")|\b(if|return|not|in|else|None|or|and)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index));
    const cls = m[1] ? "cm" : m[2] ? "st" : "kw";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(line.slice(last));
}
function codeLines(id) {
  const lines = document.getElementById(id).textContent.split("\n").filter(l => l.trim());
  const indent = Math.min(...lines.map(l => l.match(/^ */)[0].length));
  return lines.map(l => l.slice(indent));
}
function codePanel(id, path, startLine, extraHead = "") {
  const rows = codeLines(id).map((l, i) =>
    `<div class="row"><div class="rowbg"></div><span class="ln">${startLine + i}</span><span class="tx">${highlightPython(l)}</span></div>`
  ).join("");
  return `<div class="head"><span class="path">${path}</span><span class="muted">${extraHead}</span></div>${rows}`;
}
function setRows(panel, active) {  // active: {rowIndex: 0..1}
  panel.querySelectorAll(".rowbg").forEach((bg, i) => { bg.style.opacity = active[i] || 0; });
}
function rng(seed) {  // mulberry32: deterministic positions
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const PERSON = `<svg width="40" height="40" viewBox="0 0 40 40" style="vertical-align:middle"><circle cx="20" cy="13" r="7" fill="none" stroke="#a78bfa" stroke-width="3"/><path d="M6 36c1-8 7-12 14-12s13 4 14 12" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/></svg>`;

// ------------------------------------------------------------------ scenes
// Each scene: html (static markup; elements tagged with k="name") and update(lt, E, B), where B holds beat times.
const SCENES = [];

// 1 ─ The missing step
SCENES.push({
  beats: b => {
    const verdict = b("a verdict");
    return { changelog: b("changelog"), verdict, next: b("the next step"), proto: b("Skill Fix Loop is a prototype"),
      v: ["Success", "Skill error", "Unexpected behavior", "Other error", "or Unknown"].map(p => b(p, verdict)), local: b("runs locally") };
  },
  html: `
    <div class="h1">Skill Fix Loop</div>
    <div class="abs sub" style="left:80px;top:166px">From failed skill runs to reviewable edits</div>
    <div k="measure" class="abs panel" style="left:80px;top:250px;width:860px;height:590px;padding:30px 40px">
      <div class="plabel">Measure <span>already public</span></div>
      <div k="analytics" style="margin-top:34px">
        <div style="font:600 25px var(--body)">Success analytics per skill <span class="tag" style="margin-left:10px">changelog</span></div>
        ${[0.74, 0.58, 0.83].map((w, i) => `<div style="display:flex;align-items:center;gap:18px;margin-top:20px">
          <span class="mono muted" style="width:90px;font-size:18px">skill ${"ABC"[i]}</span>
          <div class="bar-track" style="flex:1;height:18px"><div class="bar-fill" style="width:${w * 100}%"></div></div></div>`).join("")}
      </div>
      <div k="verdicts" style="margin-top:48px">
        <div style="font:600 25px var(--body)">A verdict for every run <span class="tag" style="margin-left:10px">Skill Evals docs</span></div>
        <div style="margin-top:22px;display:flex;gap:10px">
          <span k="v0" style="font-size:20px" class="chip v-success">Success</span>
          <span k="v1" style="font-size:20px" class="chip v-skill">Skill error</span>
          <span k="v2" style="font-size:20px" class="chip v-unexp">Unexpected behavior</span>
          <span k="v3" style="font-size:20px" class="chip v-other">Other error</span>
          <span k="v4" style="font-size:20px" class="chip v-unknown">Unknown</span>
        </div>
      </div>
    </div>
    <div k="fix" class="abs panel dashed" style="left:980px;top:250px;width:860px;height:590px;padding:30px 40px">
      <div class="plabel">Fix <span>not described publicly</span></div>
      <div k="q" class="abs" style="left:0;right:0;top:200px;text-align:center;font:600 150px var(--display);color:#3a4456">?</div>
      <div k="f0" class="abs crow" style="left:60px;right:60px;top:110px;border-color:var(--fail)"><span style="font:600 28px var(--body);color:var(--fail)">Failed runs</span><span class="soft" style="font-size:22px">verdict + the rule that fired</span></div>
      <div k="f1" class="abs crow" style="left:60px;right:60px;top:270px;border-color:var(--data)"><span style="font:600 28px var(--body);color:var(--data)">Named causes</span><span class="soft" style="font-size:22px">grouped by error signature</span></div>
      <div k="f2" class="abs crow" style="left:60px;right:60px;top:430px;border-color:var(--human)"><span style="font:600 28px var(--body);color:var(--human)">Reviewable edit</span><span class="soft" style="font-size:22px">a diff a person approves</span></div>
      <div k="fa0" class="abs" style="left:420px;top:204px;font:36px var(--body);color:var(--muted)">↓</div>
      <div k="fa1" class="abs" style="left:420px;top:364px;font:36px var(--body);color:var(--muted)">↓</div>
    </div>
    <div k="foot" class="abs" style="left:80px;top:890px;width:1760px;font:24px var(--body);color:var(--soft)">
      <span class="tag" style="margin-right:14px">local</span><span class="tag" style="margin-right:18px">synthetic data</span>
      Independent prototype built from public information and synthetic data. Not affiliated with Nessie.
    </div>`,
  update(lt, E, B) {
    show(E.measure, prog(lt, 0.15));
    show(E.analytics, prog(lt, B.changelog - 0.2));
    show(E.verdicts, prog(lt, B.verdict - 0.3));
    B.v.forEach((t, i) => show(E["v" + i], prog(lt, t - 0.1, 0.4), 10));
    show(E.fix, prog(lt, B.next));
    const fill = prog(lt, B.proto, 0.7);
    E.q.style.opacity = (1 - fill) * prog(lt, B.next + 0.2);
    E.fix.style.borderColor = fill > 0.5 ? "var(--data)" : "var(--line)";
    E.fix.classList.toggle("dashed", fill <= 0.5);
    show(E.f0, prog(lt, B.proto + 0.1));
    show(E.fa0, prog(lt, B.proto + 0.5), 6);
    show(E.f1, prog(lt, B.proto + 0.6));
    show(E.fa1, prog(lt, B.proto + 1.0), 6);
    show(E.f2, prog(lt, B.proto + 1.1));
    show(E.foot, prog(lt, B.local - 0.2));
  },
});

// 2 ─ Architecture
const BX = [80, 374, 668, 962, 1256, 1550], BW = 250, BY = 430;
SCENES.push({
  beats: b => ({ jsonl: b("Jason lines"), rules: b("Rules give"), group: b("grouped into causes"), draft: b("drafted edit"),
    once: b("runs once"), person: b("a person approves"), replay: b("replay reports"), judge: b("judging runs"),
    wording: b("wording the edit"), off: b("stay off") }),
  html: `
    <div class="h1">One pipeline, plain code first</div>
    <div k="build" class="abs" style="left:${BX[0]}px;top:${BY - 66}px;width:${BX[3] + BW - BX[0]}px;height:40px;border:2px solid #3a4456;border-bottom:none;border-radius:10px 10px 0 0">
      <div class="abs mono" style="left:24px;top:-34px;font-size:20px;background:var(--bg);padding:0 10px"><span style="color:var(--data)">build()</span> <span class="muted">· loop/pipeline.py · runs once at startup</span></div>
    </div>
    ${[["traces.jsonl", "600 synthetic runs"], ["classify()", "verdict + rule"], ["cluster_failures()", "named causes"],
       ["draft()", "one diff per cause"], ["ReviewLog", "approve / edit / reject"], ["replay()", "held-out, before vs. after"]]
      .map(([n, c], i) => `<div k="b${i}" class="abs box" style="left:${BX[i]}px;top:${BY}px;width:${BW}px;height:140px">
        <div class="bname">${n}</div><div class="bcap">${c}</div></div>`).join("")}
    ${[1, 2, 3, 4, 5].map(i => `<div k="a${i}" class="abs arrow" style="left:${BX[i - 1] + BW + 4}px;top:${BY + 69}px;width:${BX[i] - BX[i - 1] - BW - 10}px"></div>`).join("")}
    <div k="icon" class="abs" style="left:${BX[4] + BW / 2 - 20}px;top:${BY + 152}px">${PERSON}</div>
    <div k="mini" class="abs" style="left:${BX[5] + 10}px;top:${BY + 160}px;width:${BW - 20}px">
      <div style="display:flex;align-items:center;gap:10px;font:16px var(--body)" class="muted"><span style="width:52px">before</span><div class="bar-track" style="flex:1;height:14px"><div class="bar-fill" style="width:62%"></div></div></div>
      <div style="display:flex;align-items:center;gap:10px;font:16px var(--body);margin-top:10px" class="muted"><span style="width:52px">after</span><div class="bar-track" style="flex:1;height:14px"><div k="minifill" class="bar-fill" style="width:62%"></div></div></div>
    </div>
    ${[["j", 1, "optional LLM judge", "Unknown runs only · stored apart"], ["d", 3, "optional LLM drafter", "edit wording · falls back to template"]]
      .map(([k, i, n, c]) => `<div k="${k}c" class="abs" style="left:${BX[i] + BW / 2}px;top:${BY + 140}px;height:80px;border-left:2px dashed #5b6579"></div>
        <div k="${k}" class="abs box dashed" style="left:${BX[i] - 30}px;top:${BY + 220}px;width:${BW + 60}px;height:120px;border-color:#5b6579;background:transparent">
          <div class="bname" style="font-family:var(--body);color:var(--soft)">${n}</div><div class="bcap muted" style="font-size:17px">${c}</div></div>`).join("")}
    <div k="off" class="abs mono" style="left:${BX[1] - 30}px;top:${BY + 380}px;font-size:22px">

    return { type: b("type make demo"), installs: b("installs the pinned"), starts: b("starts the app"), nokey: b("no API key"),
      shots: [b("skills", loop), b("skill detail"), b("proposed edit"), b("trace viewer"), b("and results")], env: b("set a model") };
  },
  html: `
    <div class="h1">Run the demo</div>
    <div k="term" class="abs panel" style="left:80px;top:200px;width:1020px;height:250px;padding:26px 30px;background:#0a0e14">
      <div class="mono" style="font-size:26px"><span style="color:var(--ok)">$</span> <span k="typed"></span></div>
      <div k="o1" class="mono muted" style="font-size:20px;margin-top:20px;line-height:32px">python -m pip install -q -r requirements.txt<br>python -m loop.app</div>
      <div k="o2" class="mono" style="font-size:20px;margin-top:12px">Starting Skill Fix Loop at <span style="color:var(--data)">http://127.0.0.1:8000</span></div>
      <div k="nokey" class="abs tag" style="right:28px;top:26px;color:var(--ok);border-color:#2f5e4a;font-size:18px">no API key needed</div>
    </div>
    <div k="env" class="abs panel" style="left:1140px;top:200px;width:700px;height:250px;padding:26px 30px;border-color:#5b6579;border-style:dashed">
      <div class="mono" style="font-size:20px"><span style="color:var(--state)">.env</span> <span class="muted">· optional LLM path</span></div>
      <div class="mono" style="font-size:21px;margin-top:22px;line-height:38px">LLM_MODEL=<span class="muted">&lt;provider/model&gt;</span><br>&lt;PROVIDER&gt;_API_KEY=<span class="muted">&lt;API_KEY&gt;</span></div>
      <div class="mono muted" style="font-size:17px;margin-top:18px">pip install -r requirements-llm.txt</div>
    </div>
    ${SHOTS.map(([f, c], i) => `<div k="s${i}"><div class="shot" style="left:${80 + i * 358}px;top:560px"><img src="../screenshots/${f}" alt="" style="margin-top:${-(SHOT_SKIP[f] || 0)}px"></div>
      <div class="shotcap" style="left:${80 + i * 358}px;top:878px">${c}</div></div>`).join("")}`,
  update(lt, E, B) {
    show(E.term, prog(lt, 0.1));
    const cmd = "make demo", n = Math.round(cmd.length * clamp((lt - B.type - 0.25) / 0.6));
    E.typed.textContent = cmd.slice(0, n) + (lt < B.installs ? "▍" : "");
    show(E.o1, prog(lt, B.installs - 0.1), 6);
    show(E.o2, prog(lt, B.starts), 6);
    show(E.nokey, prog(lt, B.nokey - 0.1), 6);
    B.shots.forEach((t, i) => show(E["s" + i], prog(lt, t - 0.2), 20));
    show(E.env, prog(lt, B.env - 0.3));
  },
});

// 7 ─ Gotchas
const GOTCHAS = ["Feedback never decides alone", "Replay is simulated", "The data is synthetic and easy",
  "Approved diffs aren't applied", "Workflows are flagged, not fixed"];
const GCOL = ["var(--human)", "var(--state)", "var(--fail)", "var(--state)", "var(--ok)"];
SCENES.push({
  beats: b => ({ g: [b("Agent feedback never"), b("Replay is simulated"), b("synthetic and easy"), b("never written back"),
    b("repeated workflows")], clean: b("A clean run"), overstates: b("overstates") }),
  html: `
    <div class="h1">Before you trust the numbers</div>
    <div class="abs" style="left:80px;top:210px;width:620px">
      ${GOTCHAS.map((g, i) => `<div k="g${i}" class="gitem"><b>${i + 1}</b>${g}</div>`).join("")}
    </div>
    <div k="detail" class="abs panel" style="left:740px;top:210px;width:1100px;height:560px">
      <div k="k0" class="gcard">
        <div class="gtitle">Feedback is one signal, not the verdict</div>
        <div class="crow" style="gap:20px"><span class="mono" style="font-size:20px;width:300px">exit 2 + feedback <span style="color:var(--ok)">“success”</span></span><span class="muted" style="font-size:28px">→</span><span class="chip v-skill">Skill error</span><span class="soft" style="font-size:20px">exit code wins · rule 4</span></div>
        <div k="k0b" class="crow" style="gap:20px"><span class="mono" style="font-size:20px;width:300px">clean run + feedback <span style="color:var(--fail)">“failure”</span></span><span class="muted" style="font-size:28px">→</span><span class="chip v-unknown">Unknown</span><span class="soft" style="font-size:20px">listed under Needs triage · rule 7</span></div>
        <div class="soft" style="font:22px/34px var(--body);margin-top:26px">The optional LLM judge may look at these, but its answer is stored as <code>judge_verdict</code> and never replaces the rule verdict.</div>
        <div class="tag" style="margin-top:22px">loop/verdict.py:101-105 · loop/pipeline.py:328-332</div>
      </div>
      <div k="k1" class="gcard">
        <div class="gtitle">Replay is simulated <span class="tag" style="color:var(--state);border-color:#6b5428;margin-left:12px;vertical-align:middle">no agent is re-run</span></div>
        <div k="rcode" class="panel code" style="background:var(--bg)">${codePanel("code-replay", "loop/replay.py", 301, "…")}</div>
        <div class="soft" style="font:23px/36px var(--body);margin-top:24px">A held-out failure counts as fixed when an approved diff adds its cause's marker.
          <span k="over" style="color:var(--text)">That overstates real gains.</span></div>
      </div>
      <div k="k2" class="gcard">
        <div class="gtitle">Synthetic data, written to be separable</div>
        <div style="display:flex;gap:30px;margin-top:10px">
          <div class="panel" style="flex:1;padding:28px;background:var(--bg)"><div style="font:600 84px var(--display)">100%</div><div class="soft" style="font-size:23px">cluster purity vs. injected causes</div></div>
          <div class="panel" style="flex:1;padding:28px;background:var(--bg)"><div style="font:600 84px var(--display)">57 / 60</div><div class="soft" style="font-size:23px">verdict accuracy on the eval set</div></div>
        </div>
        <div class="soft" style="font:23px/36px var(--body);margin-top:28px">These show the plumbing works, not real-world accuracy. The eval labels are what the generator intended, not independent human labels.</div>
      </div>
      <div k="k3" class="gcard">
        <div class="gtitle">Decisions are logged; skill files stay unchanged</div>
        <div style="display:flex;align-items:center;gap:30px;margin-top:30px">
          <div class="panel" style="padding:26px 30px;border-color:var(--human);font:24px var(--body)">${PERSON} Approve</div>
          <div class="muted" style="font-size:36px">→</div>
          <div class="panel mono" style="padding:26px 30px;border-color:var(--state);font-size:22px;color:var(--state)">data/reviews.jsonl</div>
        </div>
        <div style="display:flex;align-items:center;gap:30px;margin-top:30px">
          <div class="panel mono" style="padding:26px 30px;font-size:22px;color:var(--state);opacity:.8">skills/deploy-preview/SKILL.md</div>
          <div class="soft" style="font-size:24px">unchanged</div>
        </div>
        <div class="soft" style="font:23px/36px var(--body);margin-top:34px">No permissions or multi-reviewer approval yet.</div>
      </div>
      <div k="k4" class="gcard">
        <div class="gtitle">Repeated workflows → candidate new skill</div>
        <div style="display:flex;align-items:center;gap:16px;margin-top:20px;flex-wrap:wrap">
          <span class="crow mono" style="margin:0;font-size:21px">pg_dump --schema-only</span><span class="muted" style="font-size:28px">→</span>
          <span class="crow mono" style="margin:0;font-size:21px">pg_dump --schema-only</span><span class="muted" style="font-size:28px">→</span>
          <span class="crow mono" style="margin:0;font-size:21px">diff -u</span>
        </div>
        <div class="soft" style="font:23px/36px var(--body);margin-top:30px">19 successful <code>write-migration</code> runs do these steps, which the skill never mentions.
          It's flagged for a person to consider, not drafted as a fix.</div>
        <div class="chip" style="margin-top:26px;border:2px solid var(--ok);color:var(--ok)">candidate new skill</div>
      </div>
    </div>`,
  update(lt, E, B) {
    show(E.detail, prog(lt, B.g[0] - 0.3));
    B.g.forEach((t, i) => {
      const next = B.g[i + 1] ?? Infinity;
      show(E["g" + i], prog(lt, t - 0.2), 10);
      const active = prog(lt, t - 0.2, 0.3) * (1 - prog(lt, next - 0.2, 0.3));
      E["g" + i].style.borderLeftColor = active > 0.5 ? GCOL[i] : "var(--line)";
      E["g" + i].style.color = active > 0.5 || lt < t ? "var(--text)" : "var(--muted)";
      const card = window_(lt, t - 0.2, next - 0.35, 0.35);
      E["k" + i].style.opacity = card; E["k" + i].style.visibility = card < 0.001 ? "hidden" : "visible";
    });
    show(E.k0b, prog(lt, B.clean - 0.1), 8);
    setRows(E.rcode, { 2: prog(lt, B.g[1] + 1.0, 0.4) });
    E.over.style.color = prog(lt, B.overstates - 0.1) > 0.5 ? "var(--state)" : "var(--soft)";
  },
});

// 8 ─ Recap
const RECAP = [["Every verdict names its rule", "var(--data)"], ["Failures → a few named causes", "var(--fail)"],
  ["One diff per cause, with cited traces", "var(--state)"], ["A person decides; every decision is logged", "var(--human)"],
  ["Success measured on held-out runs", "var(--ok)"]];
const NEXT = ["Real agent reruns", "Judge vs. human labels", "Per-harness normalizers", "Who may approve shared skills"];
SCENES.push({
  beats: b => ({ r: [b("Every verdict"), b("Failures become"), b("Each cause gets"), b("A person decides"), b("success is measured")],
    next: b("Next steps"), n: [b("real agent reruns"), b("checking the judge"), b("normalizers"), b("deciding who")] }),
  html: `
    <div class="h1">Recap</div>
    <div class="abs" style="left:80px;top:220px">
      ${RECAP.map(([t, c], i) => `<div k="r${i}" class="recap"><i style="background:${c}"></i>${t}</div>`).join("")}
    </div>
    <div k="nexth" class="abs plabel" style="left:80px;top:770px">Next steps</div>
    <div class="abs" style="left:80px;top:820px">${NEXT.map((n, i) => `<span k="n${i}" class="next">${n}</span>`).join("")}</div>
    <div k="foot" class="abs muted" style="left:80px;top:960px;font:20px var(--body)">Independent prototype built from public information and synthetic data. Not affiliated with Nessie.</div>`,
  update(lt, E, B) {
    B.r.forEach((t, i) => show(E["r" + i], prog(lt, t - 0.2), 14));
    show(E.nexth, prog(lt, B.next - 0.2), 8);
    B.n.forEach((t, i) => show(E["n" + i], prog(lt, t - 0.2), 10));
    show(E.foot, prog(lt, B.n[3] + 1.0), 0);
  },
});

// ------------------------------------------------------------------ build + renderAt
const scenesEl = document.getElementById("scenes");
const progressEl = document.getElementById("progress");
const chapterEl = document.getElementById("chapter");
const built = SCENES.map((def, i) => {
  const sc = T.scenes[i];
  const el = document.createElement("div");
  el.className = "scene";
  el.innerHTML = def.html;
  scenesEl.appendChild(el);
  const E = {};
  el.querySelectorAll("[k]").forEach(n => { E[n.getAttribute("k")] = n; });
  const B = def.beats(beatFinder(sc));
  const seg = document.createElement("div");
  seg.className = "seg"; seg.style.flex = sc.duration; seg.innerHTML = '<div class="fill"></div>';
  progressEl.appendChild(seg);
  return { def, sc, el, E, B, fill: seg.firstChild };
});

window.renderAt = function renderAt(t) {
  t = clamp(t, 0, T.total - 1e-6);
  built.forEach(({ def, sc, el, E, B, fill }) => {
    const lt = t - sc.start;
    const active = lt >= 0 && lt < sc.duration;
    el.style.display = active ? "block" : "none";
    fill.style.transform = `scaleX(${clamp(lt / sc.duration)})`;
    if (!active) return;
    el.style.opacity = prog(lt, 0, 0.35) * (1 - prog(lt, sc.duration - 0.35, 0.35));
    def.update(lt, E, B);
    const [num, ...rest] = sc.chapter.split(" / ");
    chapterEl.innerHTML = `<b>${num}</b> / ${esc(rest.join(" / "))}`;
  });
};

window.kvReady = Promise.all([
  document.fonts.ready,
  ...[...document.images].map(img => (img.complete ? null : new Promise(r => { img.onload = img.onerror = r; }))),
]).then(() => true);

// ------------------------------------------------------------------ preview mode (not used for rendering)
if (!document.body.classList.contains("render")) {
  const vp = document.getElementById("viewport");
  const fit = () => { const s = Math.min(innerWidth / 1920, (innerHeight - 52) / 1080); vp.style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  const scrub = document.getElementById("scrub"), clock = document.getElementById("clock");
  const audio = document.getElementById("narration"), btn = document.getElementById("play");
  let playing = false, t0 = 0, wall = 0, hasAudio = false;
  audio.addEventListener("canplay", () => { hasAudio = true; });
  const now = () => (hasAudio ? audio.currentTime : t0 + (performance.now() - wall) / 1000);
  const draw = t => { renderAt(t); scrub.value = (t / T.total) * 1000; clock.textContent = t.toFixed(2) + "s"; };
  const loop = () => { if (!playing) return; const t = now(); draw(t); if (t >= T.total) { playing = false; btn.textContent = "Play"; } else requestAnimationFrame(loop); };
  btn.onclick = () => {
    playing = !playing; btn.textContent = playing ? "Pause" : "Play";
    if (playing) { t0 = (scrub.value / 1000) * T.total; wall = performance.now(); if (hasAudio) { audio.currentTime = t0; audio.play(); } loop(); }
    else if (hasAudio) audio.pause();
  };
  scrub.oninput = () => { const t = (scrub.value / 1000) * T.total; if (hasAudio) audio.currentTime = t; t0 = t; wall = performance.now(); draw(t); };
  draw(Number(params.get("t") || 0));
}
</script>
